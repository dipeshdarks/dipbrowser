appId: com.dipbrowser.app
productName: DipBrowser
directories:
  output: release
publish:
  provider: github
  owner: dipeshdarks
  repo: dipbrowser
files:
  - "!**/.vscode/*"
  - "!src/*"
  - "!electron.vite.config.*"
  - "!{.eslintignore,.eslintrc.*,.prettierignore,.prettierrc.*,tsconfig.json,tsconfig.*.json}"
  - out
win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: ${productName}-${version}-setup.${ext}
nsis:
  artifactName: ${productName}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  createStartMenuShortcut: true
  allowToChangeInstallationDirectory: false
mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  category: public.app-category.browsers
linux:
  target:
    - target: AppImage
      arch:
        - x64
  category: Network
